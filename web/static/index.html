<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingAgents</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --border: #262c35; --text: #e6e8eb; --muted: #8b93a1;
    --accent: #4f8cff; --ok: #3ccf74; --warn: #f5b942; --err: #ff5c5c; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; min-height: calc(100vh - 50px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=date], select { width: 100%; padding: 7px 9px; background: #0d1014; color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; font-size: 13px; }
  .checks label { margin: 0; color: var(--text); display: flex; align-items: center; gap: 6px; }
  button { padding: 9px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; width: 100%; margin-top: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  .keywarn { font-size: 12px; color: var(--warn); margin-top: 6px; }
  .right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .row { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
  @media (max-width: 1200px) { .row { grid-template-columns: 1fr; } }
  .team { margin-bottom: 8px; }
  .team .name { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .agent { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #2a3039; color: var(--muted); }
  .badge.in_progress { background: #3a3110; color: var(--warn); }
  .badge.completed { background: #12331f; color: var(--ok); }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; font-family: var(--mono); }
  .status { font-weight: 600; }
  .status.running { color: var(--warn); } .status.completed { color: var(--ok); } .status.failed { color: var(--err); }
  .decision { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .tab { padding: 5px 10px; border-radius: 6px; background: #0d1014; border: 1px solid var(--border); color: var(--muted); font-size: 12px; cursor: pointer; }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .tab.has { color: var(--text); }
  .md { max-height: 70vh; overflow: auto; padding-right: 6px; }
  .md h1,.md h2,.md h3 { margin: 14px 0 6px; } .md table { border-collapse: collapse; } .md td,.md th { border: 1px solid var(--border); padding: 3px 8px; }
  .md code, .md pre { font-family: var(--mono); font-size: 12px; background: #0d1014; }
  .log { font-family: var(--mono); font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .log .m { padding: 2px 0; border-bottom: 1px dashed #1f242c; }
  .log .t { color: var(--muted); } .log .k { color: var(--accent); }
  .log .k.Tool { color: var(--warn); } .log .k.Data { color: var(--ok); } .log .k.System { color: #c792ea; }
  .runs { font-size: 12px; } .runs a { color: var(--accent); cursor: pointer; text-decoration: none; } .runs div { padding: 2px 0; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>TradingAgents</h1>
  <span class="sub">multi-agent LLM trading analysis · web UI</span>
</header>
<main>
  <aside>
    <form class="card" id="form">
      <h2>New analysis</h2>
      <label>Ticker</label>
      <input type="text" id="ticker" value="SPY" required placeholder="SPY, NVDA, BTC-USD, 0700.HK">
      <label>Analysis date</label>
      <input type="date" id="date" required>
      <label>Analysts</label>
      <div class="checks" id="analysts"></div>
      <label>Research depth</label>
      <select id="depth"></select>
      <label>LLM provider</label>
      <select id="provider"></select>
      <div class="keywarn" id="keywarn"></div>
      <label>Backend URL</label>
      <input type="text" id="backend" placeholder="provider default">
      <label>Quick-thinking model</label>
      <select id="quick"></select>
      <input type="text" id="quick_custom" placeholder="custom model id" style="display:none;margin-top:4px">
      <label>Deep-thinking model</label>
      <select id="deep"></select>
      <input type="text" id="deep_custom" placeholder="custom model id" style="display:none;margin-top:4px">
      <label>Report language</label>
      <select id="lang"></select>
      <button type="submit" id="go">Run analysis</button>
    </form>
    <div class="card runs" style="margin-top:16px">
      <h2>Runs</h2>
      <div id="runs" class="empty">none yet</div>
    </div>
  </aside>
  <section class="right">
    <div class="row">
      <div class="card">
        <h2>Progress</h2>
        <div><span id="rstatus" class="status">idle</span> <span id="rtitle" class="sub"></span></div>
        <div class="decision" id="decision"></div>
        <div id="teams" style="margin-top:10px"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="card">
        <h2>Reports</h2>
        <div class="tabs" id="tabs"></div>
        <div class="md" id="report"><span class="empty">Start a run to see reports stream in.</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Messages &amp; tool calls</h2>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let OPTS = null, es = null, current = null, activeTab = null;

function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(s) { try { return marked.parse(s || ''); } catch { return '<pre>' + esc(s) + '</pre>'; } }

async function loadOptions() {
  OPTS = await (await fetch('/api/options')).json();
  $('date').value = new Date().toISOString().slice(0, 10);
  $('analysts').innerHTML = OPTS.analysts.map(a =>
    `<label><input type="checkbox" value="${a.key}" checked> ${a.label}</label>`).join('');
  $('depth').innerHTML = OPTS.depths.map(d => `<option value="${d.value}">${d.label}</option>`).join('');
  $('depth').value = OPTS.defaults.research_depth;
  $('provider').innerHTML = OPTS.providers.map(p =>
    `<option value="${p.key}">${p.display}${p.has_key ? '' : ' (no key)'}</option>`).join('');
  $('provider').value = OPTS.defaults.llm_provider;
  $('lang').innerHTML = OPTS.languages.map(l => `<option>${l}</option>`).join('');
  $('lang').value = OPTS.defaults.output_language;
  onProvider(true);
  refreshRuns();
}

function provider() { return OPTS.providers.find(p => p.key === $('provider').value); }

function fillModels(sel, custom, models, preferred) {
  sel.innerHTML = models.map(m => `<option value="${m.value}">${m.label}</option>`).join('');
  if (!models.length) { sel.innerHTML = '<option value="custom">Custom model ID</option>'; }
  if (preferred && models.some(m => m.value === preferred)) sel.value = preferred;
  else if (!models.length || models[0].value === 'custom') sel.value = 'custom';
  sel.onchange = () => { custom.style.display = sel.value === 'custom' ? '' : 'none'; };
  sel.onchange();
}

function onProvider(initial) {
  const p = provider();
  $('backend').value = p.backend_url || '';
  $('keywarn').textContent = p.has_key ? '' :
    `${p.api_key_env} is not set on the server — add it to .env and restart.`;
  const d = OPTS.defaults;
  fillModels($('quick'), $('quick_custom'), p.quick_models, initial && p.key === d.llm_provider ? d.quick_think_llm : null);
  fillModels($('deep'), $('deep_custom'), p.deep_models, initial && p.key === d.llm_provider ? d.deep_think_llm : null);
  if (initial && p.key === d.llm_provider) {
    if ($('quick').value !== d.quick_think_llm) { $('quick').value = 'custom'; $('quick').onchange(); $('quick_custom').value = d.quick_think_llm; }
    if ($('deep').value !== d.deep_think_llm) { $('deep').value = 'custom'; $('deep').onchange(); $('deep_custom').value = d.deep_think_llm; }
  }
}
$('provider').addEventListener('change', () => onProvider(false));

function modelValue(sel, custom) { return sel.value === 'custom' ? custom.value.trim() : sel.value; }

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    ticker: $('ticker').value.trim(),
    analysis_date: $('date').value,
    analysts: [...document.querySelectorAll('#analysts input:checked')].map(i => i.value),
    research_depth: Number($('depth').value),
    llm_provider: $('provider').value,
    backend_url: $('backend').value.trim() || null,
    quick_think_llm: modelValue($('quick'), $('quick_custom')),
    deep_think_llm: modelValue($('deep'), $('deep_custom')),
    output_language: $('lang').value,
  };
  if (!body.quick_think_llm || !body.deep_think_llm) { alert('Enter a model id'); return; }
  $('go').disabled = true;
  try {
    const r = await fetch('/api/runs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) { alert(await r.text()); return; }
    const { id } = await r.json();
    history.replaceState(null, '', '#' + id);
    attach(id);
    refreshRuns();
  } finally { $('go').disabled = false; }
});

async function refreshRuns() {
  const runs = await (await fetch('/api/runs')).json();
  $('runs').className = runs.length ? 'runs' : 'runs empty';
  $('runs').innerHTML = runs.length ? runs.map(r =>
    `<div><a onclick="attach('${r.id}')">${r.ticker} ${r.date}</a> · <span class="status ${r.status}">${r.status}</span>${r.decision ? ' · ' + esc(r.decision) : ''}</div>`).join('') : 'none yet';
}

function attach(id) {
  if (es) es.close();
  current = { id, agent_status: {}, sections: {}, messages: [], stats: {}, status: 'queued', params: {} };
  activeTab = null;
  $('log').innerHTML = ''; $('report').innerHTML = ''; $('decision').textContent = '';
  es = new EventSource(`/api/runs/${id}/events`);
  es.addEventListener('snapshot', (e) => { Object.assign(current, JSON.parse(e.data)); renderAll(); });
  es.addEventListener('init', (e) => { const d = JSON.parse(e.data); current.agent_status = d.agent_status; d.sections.forEach(s => current.sections[s] = current.sections[s] || null); renderTeams(); renderTabs(); });
  es.addEventListener('status', (e) => { const d = JSON.parse(e.data); current.status = d.status; current.error = d.error; renderStatus(); refreshRuns(); });
  es.addEventListener('agent', (e) => { const d = JSON.parse(e.data); current.agent_status[d.agent] = d.status; renderTeams(); });
  es.addEventListener('section', (e) => { const d = JSON.parse(e.data); current.sections[d.name] = d.content; if (!activeTab) activeTab = d.name; renderTabs(); if (activeTab === d.name) renderReport(); });
  es.addEventListener('message', (e) => { appendMessage(JSON.parse(e.data)); });
  es.addEventListener('stats', (e) => { current.stats = JSON.parse(e.data); renderStats(); });
  es.addEventListener('done', (e) => { const d = JSON.parse(e.data); current.decision = d.decision; renderStatus(); });
  es.addEventListener('end', () => { es.close(); es = null; refreshRuns(); });
}

function renderAll() { renderStatus(); renderTeams(); renderTabs(); renderReport(); renderStats(); $('log').innerHTML = ''; current.messages.forEach(appendMessage); }

function renderStatus() {
  $('rstatus').textContent = current.status; $('rstatus').className = 'status ' + current.status;
  const p = current.params || {};
  $('rtitle').textContent = p.ticker ? `${p.ticker} · ${p.analysis_date} · ${p.llm_provider}` : '';
  $('decision').textContent = current.decision ? `Decision: ${current.decision}` : (current.error ? `Error: ${current.error}` : '');
}

function renderTeams() {
  $('teams').innerHTML = Object.entries(OPTS.teams).map(([team, agents]) => {
    const rows = agents.filter(a => a in current.agent_status).map(a =>
      `<div class="agent"><span>${a}</span><span class="badge ${current.agent_status[a]}">${current.agent_status[a].replace('_', ' ')}</span></div>`).join('');
    return rows ? `<div class="team"><div class="name">${team}</div>${rows}</div>` : '';
  }).join('');
}

function renderTabs() {
  const keys = Object.keys(current.sections);
  if (!activeTab) activeTab = keys.find(k => current.sections[k]) || keys[0];
  $('tabs').innerHTML = keys.map(k =>
    `<span class="tab ${k === activeTab ? 'active' : ''} ${current.sections[k] ? 'has' : ''}" onclick="activeTab='${k}';renderTabs();renderReport()">${OPTS.section_titles[k] || k}</span>`).join('');
}

function renderReport() {
  const c = activeTab && current.sections[activeTab];
  $('report').innerHTML = c ? md(c) : '<span class="empty">Waiting for this section…</span>';
}

function renderStats() {
  const s = current.stats || {};
  $('stats').innerHTML = Object.keys(s).length ?
    `<span>LLM calls: ${s.llm_calls}</span><span>Tool calls: ${s.tool_calls}</span><span>Tokens in: ${s.tokens_in}</span><span>Tokens out: ${s.tokens_out}</span>` : '';
}

function appendMessage(m) {
  const el = document.createElement('div'); el.className = 'm';
  const txt = m.content.length > 600 ? m.content.slice(0, 600) + '…' : m.content;
  el.innerHTML = `<span class="t">${m.time}</span> <span class="k ${m.type}">${m.type}</span> ${esc(txt)}`;
  const log = $('log'); const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.appendChild(el); if (stick) log.scrollTop = log.scrollHeight;
}

loadOptions().then(() => { const id = location.hash.slice(1); if (id) attach(id); });
</script>
</body>
</html>
